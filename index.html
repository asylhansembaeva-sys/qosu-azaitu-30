<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>10-ға дейін қосу және азайту</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Times New Roman',serif}body{background:linear-gradient(180deg,#dceafa 0%,#e9f2fc 58%,#dce9f8 100%);color:#17325c}.app{width:min(1100px,100%);min-height:100dvh;margin:auto;display:flex;flex-direction:column;padding:clamp(12px,2.5vw,28px);gap:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.pill{background:#ffffffba;border:2px solid #b7cbe8;border-radius:18px;padding:8px 14px;font-size:clamp(17px,2.4vw,27px);font-weight:900;box-shadow:0 4px 9px #6881ac25}h1{text-align:center;margin:4px 0 0;font-size:clamp(24px,3.8vw,45px);color:#d00000;text-shadow:0 2px 0 #fff9}.playzone{display:contents}.question{display:flex;justify-content:center;align-items:center;gap:clamp(5px,1.7vw,23px);flex:1;min-height:165px;white-space:nowrap;font-family:Arial,sans-serif;font-weight:900;font-size:clamp(78px,14.5vw,190px);letter-spacing:-.045em}.num{color:#1476e6;-webkit-text-stroke:clamp(1px,.18vw,2.5px) #083b8e;text-shadow:0 4px 0 #b5cfff,0 6px 9px #6686c777}.op{color:#f25b27;-webkit-text-stroke:1px #bc3b13;text-shadow:0 4px 3px #e58b6a66}.eq{color:#ff9d22;-webkit-text-stroke:1px #c96809}.qmark{color:#a75bd6;-webkit-text-stroke:1.5px #66339d;text-shadow:0 4px 0 #e4c6ff}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,2vw,24px);width:min(660px,100%);margin:0 auto;align-items:center;justify-items:center}.choice{width:clamp(100px,16vw,162px);height:clamp(100px,16vw,162px);border-radius:50%;font:900 clamp(52px,8vw,93px) Arial,sans-serif;color:white;-webkit-text-stroke:2px #17345e;cursor:pointer;border:4px solid #ffffff9e;box-shadow:inset -9px -13px 13px #0002,inset 8px 9px 13px #fff8,0 7px 0 #5d78a144,0 12px 15px #304c7c33;touch-action:manipulation;transition:transform .13s,filter .13s}.choice:active{transform:scale(.94)}.choice:nth-child(1){background:radial-gradient(circle at 30% 22%,#ffe381,#ffad1c 60%,#d66c03)}.choice:nth-child(2){background:radial-gradient(circle at 30% 22%,#b0ef83,#47bb35 60%,#178022)}.choice:nth-child(3){background:radial-gradient(circle at 30% 22%,#9ce3ff,#218fe9 60%,#0759bf)}.choice.wrong{animation:shake .3s}.choice.correct{box-shadow:0 0 0 7px #fff,0 0 25px #54cc77,inset 8px 9px 13px #fff8}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}.bottom{text-align:center;min-height:75px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px}.feedback{font-size:clamp(19px,3vw,30px);font-weight:bold;min-height:35px}.restart{border:0;background:#3675cb;color:white;border-radius:14px;padding:9px 19px;font: bold 20px 'Times New Roman',serif;cursor:pointer}.done{position:fixed;inset:0;background:#1b3e77aa;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.done.show{display:flex}.modal{background:white;border-radius:26px;padding:30px;text-align:center;width:min(520px,100%);box-shadow:0 20px 60px #0004}.modal h2{font-size:45px;color:#3162ab}.modal p{font-size:28px}.modal button{background:#356bd1;color:white;border:0;border-radius:16px;padding:14px 25px;font: bold 25px 'Times New Roman',serif;cursor:pointer}@media(max-width:600px){.app{padding:12px 8px;gap:8px}.pill{padding:7px;font-size:16px}.question{font-size:clamp(62px,15vw,105px);min-height:180px;gap:3px}.choices{gap:4px;width:min(100%,420px);grid-template-columns:repeat(3,minmax(0,1fr))}.choice{width:min(28vw,125px);height:min(28vw,125px);font-size:clamp(43px,12vw,72px);-webkit-text-stroke:1px #17345e}h1{font-size:clamp(23px,6vw,34px)}}@media(max-width:600px){
.app{min-height:100dvh;gap:8px;padding:12px 8px 16px}
.playzone{display:flex;flex:1;min-height:0;width:100%;flex-direction:column;align-items:center;justify-content:center;gap:clamp(24px,5.5vh,70px)}
.question{flex:0 0 auto;min-height:0;width:100%;font-size:clamp(70px,20vw,140px);gap:clamp(1px,.7vw,7px);letter-spacing:-.055em}
.question.long{font-size:clamp(55px,15vw,106px)}
.choices{flex:0 0 auto;width:min(100%,440px);gap:4px}
.choice{width:min(29vw,132px);height:min(29vw,132px)}
.bottom{min-height:70px}
}
@media(min-width:800px){.question{min-height:220px}.app{justify-content:space-between}}
</style></head><body><main class="app"><div class="top"><div class="pill" id="clock">⏱ 00:00</div><div class="pill" id="progress">Тапсырма 1 / 30</div><div class="pill" id="stars">⭐ 0</div></div><h1>10-ҒА ДЕЙІН ҚОСУ ЖӘНЕ АЗАЙТУ</h1><div class="playzone"><div class="question" id="question" aria-label="Есеп"><span class="num">2</span><span class="op">+</span><span class="num">2</span><span class="eq">=</span><span class="qmark">?</span></div><div class="choices" id="choices"><button class="choice">5</button><button class="choice">4</button><button class="choice">6</button></div></div><div class="bottom"><div class="feedback" id="feedback" aria-live="polite">Дұрыс жауапты таңда!</div><button class="restart" id="restart">↻ Қайта бастау</button></div></main><div class="done" id="done"><div class="modal"><h2>🏆 Жарайсың!</h2><p id="summary"></p><button id="again">Қайта ойнау</button></div></div><script>
(function(){'use strict';
// 15 different addition and 15 different subtraction questions. All results 0–10.
const tasks=[
[2,'+',2],[10,'−',3],[1,'+',4],[9,'−',5],[3,'+',4],[8,'−',2],[5,'+',3],[7,'−',4],[6,'+',4],[6,'−',1],
[2,'+',5],[10,'−',8],[1,'+',8],[9,'−',2],[4,'+',2],[8,'−',5],[3,'+',3],[7,'−',6],[5,'+',4],[5,'−',5],
[1,'+',2],[10,'−',6],[2,'+',6],[9,'−',7],[4,'+',5],[8,'−',7],[1,'+',6],[7,'−',2],[3,'+',5],[6,'−',4]
];
let index=0,stars=0,started=Date.now(),busy=false,ctx=null;
const $=id=>document.getElementById(id);
function result(t){return t[1]==='+'?t[0]+t[2]:t[0]-t[2]}
function options(answer,seed){let pool=Array.from({length:11},(_,i)=>i).filter(x=>x!==answer);pool.sort((a,b)=>Math.abs(a-answer)-Math.abs(b-answer)||a-b);let a=pool[seed%3],b=pool[(seed+2)%5+3];if(a===b)b=pool.find(x=>x!==a);let list=[answer,a,b];let rotate=seed%3;return list.slice(rotate).concat(list.slice(0,rotate))}
function sound(correct){try{const AC=window.AudioContext||window.webkitAudioContext;ctx=ctx||new AC();ctx.resume();let now=ctx.currentTime;let notes=correct?[659.25,783.99,1046.5]:[310,220];notes.forEach((f,j)=>{let o=ctx.createOscillator(),g=ctx.createGain();o.type=correct?'sine':'triangle';o.frequency.setValueAtTime(f,now+j*.13);g.gain.setValueAtTime(.0001,now+j*.13);g.gain.exponentialRampToValueAtTime(.16,now+j*.13+.015);g.gain.exponentialRampToValueAtTime(.001,now+j*.13+.17);o.connect(g);g.connect(ctx.destination);o.start(now+j*.13);o.stop(now+j*.13+.18)})}catch(e){}}
function draw(){busy=false;const t=tasks[index],q=$('question');q.innerHTML='';q.classList.toggle('long',String(t[0]).length>1||String(t[2]).length>1);[[t[0],'num'],[t[1],'op'],[t[2],'num'],['=','eq'],['?','qmark']].forEach(([value,cls])=>{let s=document.createElement('span');s.className=cls;s.textContent=value;q.appendChild(s)});$('progress').textContent=`Тапсырма ${index+1} / ${tasks.length}`;$('feedback').textContent='Дұрыс жауапты таңда!';$('feedback').style.color='#17325c';const answer=result(t),vals=options(answer,index);$('choices').innerHTML='';vals.forEach(n=>{let btn=document.createElement('button');btn.className='choice';btn.textContent=n;btn.setAttribute('aria-label',n+' жауабы');btn.addEventListener('click',()=>select(n,answer,btn));$('choices').appendChild(btn)})}
function select(value,answer,btn){if(busy)return;if(value!==answer){sound(false);btn.classList.remove('wrong');void btn.offsetWidth;btn.classList.add('wrong');$('feedback').textContent='Қайта көр!';$('feedback').style.color='#bb3a27';return}busy=true;stars++;$('stars').textContent='⭐ '+stars;btn.classList.add('correct');sound(true);$('feedback').textContent='Дұрыс!';$('feedback').style.color='#1d922e';setTimeout(()=>{index++;if(index===tasks.length){let seconds=Math.floor((Date.now()-started)/1000);$('summary').textContent=`30 тапсырма аяқталды! ⭐ ${stars} · ⏱ ${Math.floor(seconds/60)} мин ${seconds%60} сек`;$('done').classList.add('show')}else draw()},850)}
function reset(){index=0;stars=0;started=Date.now();$('stars').textContent='⭐ 0';$('done').classList.remove('show');draw()}
$('restart').onclick=reset;$('again').onclick=reset;setInterval(()=>{let s=Math.floor((Date.now()-started)/1000);$('clock').textContent='⏱ '+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},300);draw();
})();
</script></body></html>
